name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install --yes e2fsprogs gdisk mtools qemu-system-x86
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-uefi, x86_64-unknown-none
      - run: cargo build -p relay-loader --target x86_64-unknown-uefi --locked
      - run: cargo build -p relay-kernel --target x86_64-unknown-none --locked

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.1
      - name: Cache supply-chain tools
        id: cargo-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-audit
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-tools-v1-${{ runner.os }}-${{ runner.arch }}-deny-0.20.2-audit-0.22.2
      - if: steps.cargo-tools.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny --version 0.20.2
      - if: steps.cargo-tools.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-audit --version 0.22.2
      - run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - run: cargo deny check advisories bans licenses sources
      - run: cargo audit --file Cargo.lock

  image:
    needs: [host, targets, supply-chain]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-uefi, x86_64-unknown-none
      - run: sudo apt-get update && sudo apt-get install --yes e2fsprogs gdisk mtools
      - run: SOURCE_DATE_EPOCH=1788739200 cargo xtask image --output target/a.img
      - run: SOURCE_DATE_EPOCH=1788739200 cargo xtask image --output target/b.img
      - run: cmp target/a.img target/b.img
      - run: cargo xtask verify-image target/a.img > target/image-verify.log
      - run: sha256sum target/a.img target/b.img > target/image.sha256
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-verification
          path: |
            target/a.img
            target/image-verify.log
            target/image.sha256
          if-no-files-found: warn

  qemu-boot:
    needs: [host, targets, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-uefi, x86_64-unknown-none
      - run: sudo apt-get update && sudo apt-get install --yes e2fsprogs gdisk mtools qemu-system-x86
      - run: cargo build -p relay-loader --release --target x86_64-unknown-uefi --locked
      - run: cargo build -p relay-kernel --release --target x86_64-unknown-none --locked
      - run: cargo xtask image --output target/relay-os.img
      - run: cargo xtask qemu boot target/relay-os.img --display none --accel tcg
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-boot-failure
          path: |
            target/qemu/serial.log
            target/qemu/qmp.log
            target/qemu/stderr.log
            target/qemu/qemu-debug.log
            target/qemu/framebuffer.ppm
          if-no-files-found: warn

  qemu-xhci:
    needs: [host, targets, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-uefi, x86_64-unknown-none
      - run: sudo apt-get update && sudo apt-get install --yes e2fsprogs gdisk mtools qemu-system-x86
      - run: cargo build -p relay-loader --release --target x86_64-unknown-uefi --locked
      - run: cargo build -p relay-kernel --release --target x86_64-unknown-none --locked
      - run: cargo xtask image --output target/relay-os.img
      - run: timeout 120 cargo xtask qemu xhci target/relay-os.img --display none --accel tcg
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-xhci-failure
          path: |
            target/qemu/serial.log
            target/qemu/qmp.log
            target/qemu/stderr.log
            target/qemu/qemu-debug.log
            target/qemu/framebuffer.ppm
          if-no-files-found: warn
